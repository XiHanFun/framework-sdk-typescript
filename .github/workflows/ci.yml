name: CI

# TypeScript SDK 的门禁：格式与静态检查、构建与类型检查、发布内容核对、全部测试（含读取规范子模块里的一致性向量，
# 以及用规范的黑盒运行器跑示例插件 echo）、插件协议的生成代码与 spec/plugin/plugin.proto 一致。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 构建与测试
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
        include:
          # 包的 engines 是 >=22：下限在 Ubuntu 上另跑一档
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出（含规范 submodule）
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 pnpm
        # 版本取 package.json 的 packageManager
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装 Go
        # 黑盒运行器从规范子模块运行（go run ./cmd/xihan-conformance），Go 版本取它的 go.mod；没有 Go 时一致性测试失败
        uses: actions/setup-go@v6
        with:
          go-version-file: spec/conformance/go.mod
          cache-dependency-path: spec/conformance/go.sum

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式与静态检查
        run: pnpm check

      - name: 构建与类型检查
        run: pnpm typecheck

      - name: 核对发布内容
        # 上一步已构建 dist：pnpm pack --dry-run 列出的文件里 exports 的每个子路径都要有 .js 与 .d.ts，不带悬空的 map
        run: pnpm check:pack

      - name: 测试
        run: pnpm test

      - name: 核对插件协议的生成代码
        # buf 与 ts-proto 都是锁定版本的开发依赖；生成物与提交的不同即 .proto 改了却没有重新生成。
        # 按 git status 判空：git diff 只看已跟踪的文件，发现不了新增的生成文件
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm generate
          if [ -n "$(git status --porcelain -- src/plugin/gen)" ]; then
            git status --porcelain -- src/plugin/gen
            git diff -- src/plugin/gen
            exit 1
          fi
