name: 发布

# 推送 v* 标签（如 v0.1.0-rc.1、v0.1.0）触发，guard 通过后发布到 npm。
# GitHub Release 与 XiHan.Framework 一样，在标签推送之后手动建（version-release 技能）。
#
# guard 跑 scripts/release-check.sh，与打标签之前在本地跑的是同一份（version-release 技能）：
# 标签只从 main 发，标签号等于 package.json 的 version 与 sdkVersion，spec 子模块钉在规范标签上
# （预发布可钉 rc，正式版只钉正式版标签，RFC-0024）。不通过就不发布。
# 手动 Run workflow 时必须选中一个版本标签；选分支会被 guard 拦下。
#
# 认证走 npm 可信发布（OIDC），无长期令牌，同时生成来源证明（provenance）。
# npmjs.com → 包 xihan-framework → Settings → Trusted Publisher → GitHub Actions：
# 组织 XiHanFun、仓库 framework-sdk-typescript、工作流文件 release.yml、环境留空。
# npm 只能给已经存在的包配可信发布者：xihan-framework 的首个版本要先在本机手动 npm publish 一次。
# 预发布以 dist-tag next 发布，不动 latest。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: 发版核对
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          # 要拿完整历史才能判断祖先关系；子模块不检出，脚本读树里记的指针
          fetch-depth: 0

      - name: 只接受版本标签
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::发布只接受版本标签触发，收到 $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi

      - name: 核对标签、版本与规范标签
        id: check
        run: bash scripts/release-check.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

  publish:
    name: 发布到 npm
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # 颁发 GitHub OIDC 令牌，npm 用它换取这一次发布的凭据并签发来源证明

    steps:
      - name: 检出（含规范 submodule）
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 pnpm
        # 版本取 package.json 的 packageManager
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        # 包只含 dist（package.json 的 files），没有 prepack 钩子，发布前必须先构建
        run: pnpm build

      - name: 发布
        # 可信发布要 npm 11.5.1 以上；这个版本已在 npm 上（重跑）就跳过
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          if [ "$(npm view "xihan-framework@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "xihan-framework@$VERSION 已在 npm 上，跳过"
            exit 0
          fi
          npm install -g npm@^11.5.1
          tag=latest
          if [ "$PRERELEASE" = true ]; then
            tag=next
          fi
          npm publish --access public --tag "$tag"
